; Moss Slate — polybar config: dark grey base, subtle green accents
; Save to: ~/.config/polybar/config.ini
; Launch:  polybar mybar   (or restart via your bspwm autostart)

[colors]
background = #1a1c1d
background-alt = #2b2f30
foreground = #c8ccca
primary = #8fbf7f
primary-dim = #6b9a62
accent = #a3cfb0
selection = #2c3b33
secondary = #8b9393
alert = #c97070
disabled = #5d6666

[bar/mybar]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = ${colors.background-alt}

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = memory cpu pipewire tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 65%

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.selection}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.secondary}

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M
date-alt = %A, %B %d, %Y %H:%M:%S

label = %date%
label-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/pipewire]
type = internal/pulseaudio

; Use the default sink
use-ui-max = true

; Format when audio is playing
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

; Format when audio is muted
format-muted-prefix = "VOL "
format-muted-prefix-foreground = ${colors.disabled}
format-muted = <label-muted>
label-muted = muted
label-muted-foreground = ${colors.disabled}

; Right-click opens a GUI mixer like pavucontrol if installed
click-right = pavucontrol

[settings]
screenchange-reload = true
pseudo-transparency = true
