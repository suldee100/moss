# Moss Slate — picom config (yshui picom v12+) with animations
# Save to: ~/.config/picom/picom.conf
# Restart: pkill picom; picom -b

# --- Rendering Backend & Sync ---
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
xrender-sync-fence = true;

# --- Performance & Gaming ---
unredir-if-possible = true;

# --- Shadows ---
shadow = false;

# --- Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Transparency & Opacity ---
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- Corners & Blur ---
corner-radius = 0;
blur-method = "none";

# --- Animations ---
# Short, subtle durations (in seconds) so the desktop still feels snappy.
animations = (
    {
        # Windows pop in when opened or shown (e.g. switching workspaces)
        triggers = ["open", "show"];
        preset = "appear";
        duration = 0.18;
    },
    {
        # Windows shrink away when closed or hidden
        triggers = ["close", "hide"];
        preset = "disappear";
        duration = 0.15;
    },
    # Optional: smoothly animate window moves/resizes (e.g. bspwm tiling
    # changes). Experimental: it also animates when you drag a window with
    # the mouse. Uncomment the block below (and add a comma after the
    # closing brace above) to try it.
    #
     # {
     #     triggers = ["geometry"];
     #     preset = "geometry-change";
     #     duration = 0.2;
     # },
);
